services:
  mysql:
    image: mysql:8.4
    container_name: service-monitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: service_monitor
      MYSQL_USER: dev
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: